# =====================================================================
# Pipeline Project - Configuration Template
# All paths support absolute paths or paths relative to project.base_dir
# =====================================================================

project:
  base_dir: "."                              # Project root directory
  input_table: "data/input/sample.tsv"       # Main input table or metadata file

# --------------------------------------------------------------------- #
# Directory layout: relative paths are resolved from project.base_dir    #
# --------------------------------------------------------------------- #
paths:
  python_dir: "python"                       # Python module directory
  src_dir: "src"                             # R/C++/other module directory
  helper_dir: "script"                       # Shell helper script directory
  data_dir: "data"                           # Raw data and resource directory
  temp_dir: "temp"                           # Temporary root directory
  log_dir: "log"                             # Log directory
  output_dir: "output"                       # Output root directory
  output_step1_table: "output/1-data_preprocessing/1-table"      # Step 1 table output
  output_step1_figure: "output/1-data_preprocessing/2-figure"    # Step 1 figure output
  output_step1_report: "output/1-data_preprocessing/3-report"    # Step 1 report output
  temp_step1: "temp/1-data_preprocessing"                        # Step 1 temporary directory
  reference: "data/reference/reference.fa"   # Example reference file

# --------------------------------------------------------------------- #
# Tool locations: keep interpreters, binaries, and envs here            #
# --------------------------------------------------------------------- #
tools:
  conda_bin: "/path/to/conda"                # Conda executable path
  python_bin: "/usr/bin/python3"             # Python interpreter path
  python_env_prefix: "/path/to/conda-env"    # Conda environment prefix
  rscript_bin: "/usr/bin/Rscript"            # Rscript path

# --------------------------------------------------------------------- #
# Runtime options: threads, thresholds, feature flags                   #
# --------------------------------------------------------------------- #
runtime:
  jobs: 4                                    # Number of parallel threads
  overwrite: false                           # Whether to overwrite outputs
